repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^(\.claude|\.agents)/
      - id: ruff-format
        exclude: ^(\.claude|\.agents)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        exclude: ^(\.claude|\.agents)/
      - id: check-yaml
        exclude: ^(\.claude|\.agents)/
      - id: end-of-file-fixer
        exclude: ^(\.claude|\.agents)/
      - id: trailing-whitespace
        exclude: ^(\.claude|\.agents)/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^(\.claude|\.agents)/
